[package]
name = "reaper-audio-daemon"
version = "0.1.0"
edition = "2021"

[lib]
name = "reaper_audio_daemon"
path = "src/lib.rs"

[[bin]]
name = "reaper-audio-daemon"
path = "src/main.rs"

[[bin]]
name = "verify_gate4"
path = "src/bin/verify_gate4.rs"

[dependencies]
cpal = "0.15"
midir = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
crossbeam-channel = "0.5"
reaper-kev-curator = { path = "../reaper-kev-curator" }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Pipes",
    "Win32_System_IO",
    "Win32_Security",
    "Win32_UI_Input_KeyboardAndMouse"
] }
